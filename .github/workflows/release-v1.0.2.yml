name: Release v1.0.2

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event.issue.title == 'Release v1.0.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Build Armored Elytra 1.14.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/armored-elytra
          git clone https://github.com/DorkixAzIgazi/armored-elytra.git /tmp/armored-elytra
          cd /tmp/armored-elytra
          git checkout 50fd568234650771c74e97fa1ee1be29cb6a05cc
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/libs"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/libs/armored-elytra-1.14.1.jar"

      - name: Download Modrinth build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          out = pathlib.Path('libs')
          out.mkdir(exist_ok=True)
          deps = [
              ('elytra-trims', '4.9.0', 'elytratrims-4.9.0.jar'),
              ('enderite-mod', '1.9.0', 'enderitemod-1.9.0.jar'),
              ('fabric-language-kotlin', '1.13.13', 'fabric-language-kotlin-1.13.13.jar'),
              ('architectury-api', '21.0.4', 'architectury-21.0.4.jar'),
              ('cloth-config', '26.2.155', 'cloth-config-26.2.155.jar'),
          ]
          headers = {'User-Agent': 'ENC4YP7ED/elytracompat-release-workflow'}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          for project, wanted, dest in deps:
              params = urllib.parse.urlencode({
                  'loaders': json.dumps(['fabric']),
                  'game_versions': json.dumps(['26.2']),
              })
              versions = get_json(f'https://api.modrinth.com/v2/project/{project}/version?{params}')

              def score(v):
                  n = v.get('version_number', '')
                  if n == wanted: return 0
                  if n.startswith(wanted): return 1
                  if wanted in n: return 2
                  return 99

              candidates = sorted((v for v in versions if score(v) < 99), key=score)
              if not candidates:
                  raise SystemExit(f'No Fabric 26.2 Modrinth version found for {project} matching {wanted}')
              version = candidates[0]
              files = version.get('files', [])
              primary = next((f for f in files if f.get('primary')), None)
              jar = primary or next((f for f in files if f.get('filename', '').endswith('.jar')), None)
              if not jar:
                  raise SystemExit(f'No jar file found for {project} {version.get("version_number")}')
              print(f'{project}: {version.get("version_number")} -> {dest}')
              req = urllib.request.Request(jar['url'], headers=headers)
              with urllib.request.urlopen(req) as r, open(out / dest, 'wb') as f:
                  f.write(r.read())
          PY

      - name: Build Elytra Compat
        run: ./gradlew clean build --no-daemon

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'elytracompat-1.0.2.jar' | head -n 1)"
          test -f "$JAR"
          echo "RELEASE_JAR=$JAR" >> "$GITHUB_ENV"
          TMP="$(mktemp -d)"
          cd "$TMP"
          jar xf "$GITHUB_WORKSPACE/$JAR" fabric.mod.json
          python - <<'PY'
          import json
          with open('fabric.mod.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m['version'] == '1.0.2', m
          assert m['depends']['fabricloader'] == '>=0.19.3', m
          assert 'elytratrims' not in m['depends'], m
          assert m['recommends']['elytratrims'] == '>=4.8.2', m
          print(json.dumps(m, indent=2))
          PY
          sha256sum "$GITHUB_WORKSPACE/$JAR"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Elytra Compat v1.0.2
          target_commitish: main
          make_latest: true
          body: |
            Dependency-resolution correction for Minecraft 26.2.

            Changes:
            - Elytra Compat itself now requires Fabric Loader >=0.19.3, the actual effective minimum for its direct code path.
            - Elytra Trims is now recommended rather than a hard dependency. The compat jar can boot without it; trim-specific integration activates when Elytra Trims is installed.
            - Elytra Trims >=4.8.2 remains the supported feature floor when present.
            - Armored Elytra >=1.14.1 and Enderite Mod >=1.9.0 remain required because Elytra Compat directly mixes into their classes.
            - Build/release metadata is verified before publishing.

            Note: Fabric Language Kotlin is a dependency of Elytra Trims, not Elytra Compat. If your installed Fabric Language Kotlin version requires Loader 0.19.5+, that separate dependency still needs either a compatible FLK version or a Loader update.
          files: ${{ env.RELEASE_JAR }}
